services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack-learning
    ports:
      - "4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - SERVICES=s3
      - DEBUG=0
    volumes:
      - "./localstack-data:/var/lib/localstack"
    restart: unless-stopped
